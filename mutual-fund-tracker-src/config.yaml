name: "Mutual Fund Tracker"
version: "1.0.0"
slug: "mutual_fund_tracker"
description: "Track Indian mutual funds, SIPs, NAV-based valuation and XIRR directly in Home Assistant."
url: "https://github.com/sheminasalam/mutual-fund-tracker"
arch:
  - aarch64
  - amd64
  - armv7
ingress: true
ingress_port: 8099
panel_icon: mdi:chart-line
panel_title: Mutual Funds
startup: services
boot: auto
init: false
homeassistant_api: true
map:
  - type: addon_config
    read_only: false
    path: /config
  - type: share
    read_only: false
    path: /share
backup: hot
stage: stable
